# Simplified AURYX build workflow — no build-time code patching.
#
# The persistence fix (SharedPreferences load/save in AppState, async main())
# is already applied directly in auryx.zip, so this workflow only builds.
# To update the app: edit the project, re-zip it as auryx.zip, push to main.
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o auryx.zip -d auryx-project

      - name: Place google-services.json
        run: |
          cp google-services.json auryx-project/android/app/google-services.json

      - name: Setup release keystore
        # Restores the persistent upload keystore from GitHub secrets so every
        # build is signed with the same key (updates install over older versions).
        # Secrets (repo Settings > Secrets and variables > Actions):
        #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$v" ]; then echo "Missing signing secret — check repo Settings > Secrets and variables > Actions" >&2; exit 1; fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > auryx-project/android/app/upload-keystore.jks
          cat > auryx-project/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd auryx-project
          flutter pub get

      - name: Build APK
        run: |
          cd auryx-project
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auryx-release-apk
          path: auryx-project/build/app/outputs/flutter-apk/app-release.apk
