name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o auryx.zip -d auryx-project

      - name: Remove aapt2 override line
        run: |
          cd auryx-project/android
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Place google-services.json
        run: |
          cp google-services.json auryx-project/android/app/google-services.json

      - name: Add shared_preferences to pubspec.yaml
        run: |
          cd auryx-project
          sed -i '/^dependencies:/a\  shared_preferences: ^2.2.0' pubspec.yaml

      - name: Update main.dart with Firebase and SharedPreferences
        run: |
          cd auryx-project/lib
          python3 -c "
          content = open('main.dart').read()

          # Import
          old_import = \"import 'package:firebase_core/firebase_core.dart';\"
          new_import = \"import 'package:firebase_core/firebase_core.dart';\nimport 'package:shared_preferences/shared_preferences.dart';\"
          content = content.replace(old_import, new_import)

          # Main function
          old_main = '''void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp();
            runApp(const AuryxApp());
          }'''
          new_main = '''void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp();
            await AppState.load();
            runApp(const AuryxApp());
          }'''
          content = content.replace(old_main, new_main)

          # AppState class
          old_appstate = '''class AppState {
            static String userName = \"আবু উবাইদা\";
            static String userEmail = \"abu@auryx.app\";
            static String userPhone = \"+8801712345678\";
            static String? profileImagePath;
            static bool isBangla = true;
            static bool isDarkMode = true;
          }'''

          new_appstate = '''class AppState {
            static String userName = \"আবু উবাইদা\";
            static String userEmail = \"abu@auryx.app\";
            static String userPhone = \"+8801712345678\";
            static String? profileImagePath;
            static bool isBangla = true;
            static bool isDarkMode = true;

            static Future<void> load() async {
              final prefs = await SharedPreferences.getInstance();
              userName = prefs.getString('userName') ?? userName;
              userEmail = prefs.getString('userEmail') ?? userEmail;
              userPhone = prefs.getString('userPhone') ?? userPhone;
              profileImagePath = prefs.getString('profileImagePath');
              isBangla = prefs.getBool('isBangla') ?? isBangla;
              isDarkMode = prefs.getBool('isDarkMode') ?? isDarkMode;
            }

            static Future<void> save() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('userName', userName);
              await prefs.setString('userEmail', userEmail);
              await prefs.setString('userPhone', userPhone);
              if (profileImagePath != null) {
                await prefs.setString('profileImagePath', profileImagePath!);
              }
              await prefs.setBool('isBangla', isBangla);
              await prefs.setBool('isDarkMode', isDarkMode);
            }
          }'''

          content = content.replace(old_appstate, new_appstate)

          # Register screen - save after setting AppState
          old_register = '''if (_nameCtrl.text.isNotEmpty) {
                    AppState.userName = _nameCtrl.text;
                  }
                  if (_emailCtrl.text.isNotEmpty) {
                    AppState.userEmail = _emailCtrl.text;
                  }
                  if (_phoneCtrl.text.isNotEmpty) {
                    AppState.userPhone = _phoneCtrl.text;
                  }'''

          new_register = '''if (_nameCtrl.text.isNotEmpty) {
                    AppState.userName = _nameCtrl.text;
                  }
                  if (_emailCtrl.text.isNotEmpty) {
                    AppState.userEmail = _emailCtrl.text;
                  }
                  if (_phoneCtrl.text.isNotEmpty) {
                    AppState.userPhone = _phoneCtrl.text;
                  }
                  await AppState.save();'''

          content = content.replace(old_register, new_register)

          open('main.dart', 'w').write(content)
          print('main.dart updated with save() calls')
          "

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd auryx-project
          flutter pub get

      - name: Build APK
        run: |
          cd auryx-project
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auryx-release-apk
          path: auryx-project/build/app/outputs/flutter-apk/app-release.apk
