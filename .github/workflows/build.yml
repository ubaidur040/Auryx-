name: Show Build Files

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o auryx.zip -d auryx-project

      - name: Show build.gradle files
        run: |
          echo "=========================================="
          echo "=== android/app/build.gradle ==="
          echo "=========================================="
          cat auryx-project/android/app/build.gradle 2>/dev/null || echo "FILE NOT FOUND: build.gradle"
          echo ""
          echo "=========================================="
          echo "=== android/app/build.gradle.kts ==="
          echo "=========================================="
          cat auryx-project/android/app/build.gradle.kts 2>/dev/null || echo "FILE NOT FOUND: build.gradle.kts"
          echo ""
          echo "=========================================="
          echo "=== android/build.gradle ==="
          echo "=========================================="
          cat auryx-project/android/build.gradle 2>/dev/null || echo "FILE NOT FOUND: android/build.gradle"
          echo ""
          echo "=========================================="
          echo "=== android/build.gradle.kts ==="
          echo "=========================================="
          cat auryx-project/android/build.gradle.kts 2>/dev/null || echo "FILE NOT FOUND: android/build.gradle.kts"
          echo ""
          echo "=========================================="
          echo "=== List files in android/app ==="
          echo "=========================================="
          ls -la auryx-project/android/app/
          echo ""
          echo "=========================================="
          echo "=== List files in android ==="
          echo "=========================================="
          ls -la auryx-project/android/
